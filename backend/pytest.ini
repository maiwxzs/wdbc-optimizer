[pytest]
testpaths = tests
addopts = -q
# Cualquier RuntimeWarning (overflow, división por cero, operación inválida) es un
# error: si la ruta numérica estable emitiera uno, las pruebas fallarían.
filterwarnings =
    error::RuntimeWarning
# Categorías asignadas por módulo en tests/conftest.py (pytest -m numerical, etc.)
markers =
    unit: prueba unitaria de una función o clase aislada
    numerical: validación matemática (gradientes, convexidad, estabilidad IEEE-754, convergencia)
    integration: interacción entre datos, optimizador, servicio y API
    architecture: restricciones de dependencias del núcleo numérico
